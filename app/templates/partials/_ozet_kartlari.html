<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
  <!-- Bugünkü alım -->
  <div class="kart p-4 sm:p-5">
    <div class="flex items-start justify-between gap-3">
      <p class="kart-etiket">Bugünkü alım</p>
      <span class="ikon-kutu bg-gradient-to-br from-emerald-500 to-fistik-600 text-emerald-600">
        <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v17.25m0 0c-1.47 0-2.87.3-4.15.84m4.15-.84c1.47 0 2.87.3 4.15.84M18.75 4.97A48.4 48.4 0 0 0 12 4.5c-2.29 0-4.55.16-6.75.47m13.5 0c1.01.14 2.01.31 3 .52m-3-.52 2.62 10.72c.12.5-.12 1.02-.6 1.2a5.99 5.99 0 0 1-2.03.36 5.99 5.99 0 0 1-2.03-.35c-.47-.19-.71-.71-.59-1.21L18.75 4.97Zm-16.5.52c.99-.2 1.99-.38 3-.52m0 0 2.62 10.72c.12.5-.12 1.02-.59 1.2a5.99 5.99 0 0 1-2.03.36 5.99 5.99 0 0 1-2.03-.35c-.47-.19-.71-.71-.59-1.21L5.25 4.97Z"/></svg>
      </span>
    </div>
    <p class="kart-deger" x-text="ozet ? kg(anim.alim) : '—'"></p>
    <p class="kart-alt" x-text="ozet ? `${ozet.teslimat_sayisi} teslimat · ${ozet.uretici_sayisi} üretici` + (ozet.emanet_teslimat_sayisi ? ` · +${kg(ozet.emanet_kg)} emanet` : '') : ''"></p>
  </div>

  <!-- Brüt alım tutarı -->
  <div class="kart p-4 sm:p-5">
    <div class="flex items-start justify-between gap-3">
      <p class="kart-etiket">Brüt alım tutarı</p>
      <span class="ikon-kutu bg-gradient-to-br from-amber-400 to-amber-600 text-amber-500">
        <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.8 2.1c.73.2 1.45-.34 1.45-1.1V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.38c0-.62.5-1.12 1.13-1.12H20.25M2.25 6v9m18-10.5v.75c0 .41.34.75.75.75h.75m-1.5-1.5h.38c.62 0 1.12.5 1.12 1.13v9.75c0 .62-.5 1.12-1.12 1.12h-.38m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.38a1.13 1.13 0 0 1-1.12-1.13V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.01v.01H18v-.01Zm-12 0h.01v.01H6v-.01Z"/></svg>
      </span>
    </div>
    <p class="kart-deger" x-text="ozet ? tl(anim.brut) : '—'"></p>
    <p class="kart-alt" x-text="ozet ? `Ort. fiyat ${ozet.ortalama_birim_fiyat ? tl(ozet.ortalama_birim_fiyat) + '/kg' : '—'}` : ''"></p>
  </div>

  <!-- Kasadan çıkan ödeme -->
  <div class="kart p-4 sm:p-5">
    <div class="flex items-start justify-between gap-3">
      <p class="kart-etiket">Kasadan çıkan ödeme</p>
      <span class="ikon-kutu bg-gradient-to-br from-teal-500 to-emerald-700 text-teal-600">
        <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a2.25 2.25 0 0 0-2.25-2.25H15a3 3 0 1 1-6 0H5.25A2.25 2.25 0 0 0 3 12m18 0v6a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 9m18 0V6a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 6v3"/></svg>
      </span>
    </div>
    <p class="kart-deger" x-text="ozet ? tl(anim.odenen) : '—'"></p>
    <p class="kart-alt" x-text="ozet ? `${ozet.odeme_sayisi} ödeme · ${tl(ozet.verilen_avans_toplami)} avans` : ''"></p>
  </div>

  <!-- Ortalama randıman -->
  <div class="kart p-4 sm:p-5">
    <div class="flex items-start justify-between gap-3">
      <p class="kart-etiket">Ortalama randıman</p>
      <span class="ikon-kutu bg-gradient-to-br from-lime-500 to-fistik-700 text-lime-600">
        <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c-4.5 1-7.5 5.2-7 10 .4 4.4 3.4 7.4 7 8 3.6-.6 6.6-3.6 7-8 .5-4.8-2.5-9-7-10Zm0 0c-1.8 4.5-2.2 10-.2 18"/></svg>
      </span>
    </div>
    <p class="kart-deger" x-text="ozet && ozet.ortalama_randiman ? yuzde(anim.randiman) : '—'"></p>
    <div class="mt-3 h-2 rounded-full bg-stone-200/70 overflow-hidden">
      <div class="h-full rounded-full bg-gradient-to-r from-emerald-500 via-fistik-500 to-amber-400 transition-all duration-1000 ease-out"
           :style="`width: ${ozet && ozet.ortalama_randiman ? Math.min(100, Number(ozet.ortalama_randiman)) : 0}%`"></div>
    </div>
  </div>
</div>
