<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siirt Fıstığı Alım Paneli</title>
  <link rel="icon" href="{{ url_for('static', path='img/logo.svg') }}" type="image/svg+xml">
  <!-- Tüm kütüphaneler yerel: internet bağlantısı olmadan çalışır (app/static/vendor/) -->
  <script src="{{ url_for('static', path='vendor/tailwindcss-3.4.5.js') }}"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fistik: { 50: '#f4f8ea', 100: '#e6efcf', 200: '#cfe0a3', 300: '#b2cc6e', 400: '#97b746',
                      500: '#7c9d2f', 600: '#627d23', 700: '#4b5f1e', 800: '#3d4d1c', 900: '#34411b' },
            kabuk: { 50: '#fbf7f1', 100: '#f4ebdc', 200: '#e8d5b7', 500: '#b98b52', 700: '#7d5a32' },
          },
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v={{ surum }}">
  <script defer src="{{ url_for('static', path='js/app.js') }}?v={{ surum }}"></script>
  <script defer src="{{ url_for('static', path='vendor/alpinejs-3.14.1.min.js') }}"></script>
</head>
<body class="bg-stone-100 text-stone-800 antialiased" x-data="panel" x-cloak>

  <!-- ─── Üst bar ─── -->
  <header class="no-print bg-white border-b border-stone-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-4">
      <img src="{{ url_for('static', path='img/logo.svg') }}" alt="" class="h-9 w-9">
      <div class="min-w-0">
        <h1 class="font-semibold leading-tight truncate">Siirt Fıstığı Alım ve Üretici Ödeme Sistemi</h1>
        <p class="text-xs text-stone-500" x-text="saat"></p>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <button @click="hepsiniYenile()" class="btn-ghost" title="Verileri yenile">
          <svg class="h-4 w-4" :class="yenileniyor && 'animate-spin'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.6m15.4 2A8 8 0 004.6 9M4.6 9H9m11 11v-5h-.6m0 0a8 8 0 01-15.4-2m15.4 2H15"/></svg>
          <span class="hidden sm:inline">Yenile</span>
        </button>
        <a href="/docs" target="_blank" class="btn-ghost">API</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6 no-print">

    <!-- ─── Günlük rapor kartları ─── -->
    {% include "partials/_ozet_kartlari.html" %}

    <!-- ─── Sekmeler ─── -->
    <nav class="flex gap-1 bg-white p-1 rounded-xl border border-stone-200 w-full sm:w-fit overflow-x-auto">
      <template x-for="s in sekmeler" :key="s.id">
        <button @click="tab = s.id" class="tab" :class="tab === s.id ? 'tab-aktif' : ''">
          <span x-text="s.ad"></span>
        </button>
      </template>
    </nav>

    <section x-show="tab === 'kantar'">{% include "partials/_kantar.html" %}</section>
    <section x-show="tab === 'uretici'">{% include "partials/_uretici_finans.html" %}</section>
    <section x-show="tab === 'fiyat'">{% include "partials/_fiyat_depo.html" %}</section>
  </main>

  {% include "partials/_modallar.html" %}

  <!-- ─── Bildirimler ─── -->
  <div class="no-print fixed bottom-4 right-4 z-50 space-y-2 w-[22rem] max-w-[calc(100vw-2rem)]">
    <template x-for="t in toasts" :key="t.id">
      <div x-transition class="rounded-lg shadow-lg border px-4 py-3 text-sm bg-white"
           :class="t.tur === 'hata' ? 'border-rose-200' : 'border-fistik-200'">
        <div class="flex gap-2">
          <span class="mt-0.5 h-2 w-2 rounded-full shrink-0" :class="t.tur === 'hata' ? 'bg-rose-500' : 'bg-fistik-500'"></span>
          <div class="min-w-0">
            <p class="font-medium" x-text="t.mesaj"></p>
            <ul class="mt-1 text-stone-500 list-disc pl-4" x-show="t.detaylar.length">
              <template x-for="d in t.detaylar"><li x-text="d"></li></template>
            </ul>
          </div>
          <button class="ml-auto text-stone-400 hover:text-stone-600" @click="toastKapat(t.id)">✕</button>
        </div>
      </div>
    </template>
  </div>
</body>
</html>
