  <g stroke="#2f5d1c" stroke-width="1" opacity=".45" fill="none">
    <path d="M60 158 22 118"/><path d="M110 128 134 74"/><path d="M150 116h62"/>
    <path d="M202 44l-12-52"/><path d="M206 46l52 8"/><path d="M330 72l38-48"/><path d="M372 62l44 16"/>
  </g>

  <!-- salkım 1 -->
  <g>
    <use href="#meyve" x="196" y="128"/><use href="#meyve2" x="176" y="140"/><use href="#meyve" x="216" y="146"/>
    <use href="#meyve" x="190" y="160"/><use href="#meyve2" x="206" y="176"/><use href="#meyve" x="230" y="124"/>
  </g>
  <!-- salkım 2 -->
  <g>
    <use href="#meyve" x="300" y="150"/><use href="#meyve2" x="318" y="162"/><use href="#meyve" x="290" y="172"/>
    <use href="#meyve" x="312" y="186"/>
  </g>

  <!-- açılmış fıstıklar -->
  <g transform="translate(92 176) rotate(-18)">
    <path d="M-1-18c-10 2-15 11-14 21 1 9 6 14 12 15-3-7-4-14-3-21 .8-6 2-11 5-15z" fill="url(#kabuk)"/>
    <path d="M1-18c10 2 15 11 14 21-1 9-6 14-12 15 3-7 4-14 3-21-.8-6-2-11-5-15z" fill="url(#kabuk)"/>
    <path d="M0-15c-4 5-5 11-4.5 17 .4 5 1.8 9 4.5 13 2.7-4 4.1-8 4.5-13 .5-6-.5-12-4.5-17z" fill="url(#ic)"/>
    <path d="M-1.5-11c-1.7 4-2.2 8-1.9 12" stroke="#9d3f5a" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".7"/>
