  <g transform="translate(370 120) rotate(14) scale(.85)">
    <path d="M-1-18c-10 2-15 11-14 21 1 9 6 14 12 15-3-7-4-14-3-21 .8-6 2-11 5-15z" fill="url(#kabuk)"/>
    <path d="M1-18c10 2 15 11 14 21-1 9-6 14-12 15 3-7 4-14 3-21-.8-6-2-11-5-15z" fill="url(#kabuk)"/>
    <path d="M0-15c-4 5-5 11-4.5 17 .4 5 1.8 9 4.5 13 2.7-4 4.1-8 4.5-13 .5-6-.5-12-4.5-17z" fill="url(#ic)"/>
