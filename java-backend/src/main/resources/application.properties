# Siirt Fıstığı — Spring Boot ayarları
# Veritabanı bağlantısı proje kökündeki .env dosyasındaki DATABASE_URL'den okunur (OrtamYukleyici).
server.port=${PORT:8000}
spring.application.name=siirt-fistik

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC

# Şema Flyway göçleriyle kurulur (V1 tablolar, V2 trigger/view). Python sürümünün kurduğu mevcut
# veritabanı bulunursa "zaten kurulu" (sürüm 2) kabul edilir.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Başlangıç verisi (kullanıcı, kalite sınıfları, kesinti türleri, silolar) — tablo boşsa eklenir
fistik.seed-demo-data=${SEED_DEMO_DATA:true}

# ─── Kimlik doğrulama ───
# JWT imza anahtarı: .env'deki JWT_SECRET (OrtamYukleyici aktarır). Yoksa her açılışta geçici anahtar üretilir.
# Demo hesapları (admin, kantar, muhasebe, fiyat, depo) ve giriş ekranındaki tek tıkla demo girişi.
# Gerçek kullanımda: DEMO_HESAPLARI=false ve BASLANGIC_SIFRESI ortam değişkeniyle güçlü bir şifre verin,
# ilk girişten sonra yönetici şifresini değiştirin.
fistik.demo-hesaplari=${DEMO_HESAPLARI:true}
fistik.baslangic-sifresi=${BASLANGIC_SIFRESI:Fistik.2026}
# Kalıcı yönetici: kullanıcı adı ve şifre yalnızca ortam değişkeninden (Render → Environment) gelir, depoya girmez.
# Hesap açılışta oluşturulur, gece sıfırlamasında silinmez. Şifre panelden değiştirilebilir;
# unutulursa YONETICI_SIFRE_SIFIRLA=true ile bir sonraki açılışta YONETICI_SIFRESI'ne döner.
fistik.yonetici.kullanici=${YONETICI_KULLANICI:}
fistik.yonetici.ad=${YONETICI_AD:}
fistik.yonetici.sifre=${YONETICI_SIFRESI:}
fistik.yonetici.sifre-sifirla=${YONETICI_SIFRE_SIFIRLA:false}

# ─── Herkese açık demo sunucusu ───
# DEMO_VERISI=true: veritabanı boşsa örnek veri yüklenir.
# GECE_SIFIRLAMA=true: her gece 03:00'te (Türkiye) işlem verisi silinip örnek veri yeniden yüklenir.
fistik.demo-verisi=${DEMO_VERISI:false}
fistik.gece-sifirlama=${GECE_SIFIRLAMA:false}
fistik.sifirlama-cron=${SIFIRLAMA_CRON:0 0 3 * * *}

# Bulutta (Render vb.) proxy arkasında doğru şema/adres
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

# API_DOKUMANI=false: Swagger/ReDoc ve /openapi.json tamamen kapanır (gerçek kullanımda önerilir).
# API'nin kendisi her durumda giriş ve rol ister; doküman yalnızca uç noktaları listeler.
springdoc.api-docs.enabled=${API_DOKUMANI:true}
springdoc.swagger-ui.enabled=${API_DOKUMANI:true}
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.default-produces-media-type=application/json

spring.mvc.problemdetails.enabled=false
# Panel dosyaları her açılışta sunucuya sorulur (değişmediyse 304, gövde gönderilmez):
# güncellemeden sonra kimse eski paneli ya da eski sayfa + yeni JS karışımını görmez.
spring.web.resources.cache.cachecontrol.no-cache=true

# Müstahsil bilgilendirme SMS'i (tartım ve avans). SMS_SAGLAYICI=simulasyon: gerçek SMS gitmez, loglanır.
# Gerçek gönderim: SMS_SAGLAYICI=netgsm ve SMS_KULLANICI, SMS_SIFRE, SMS_BASLIK (Netgsm'de onaylı gönderici adı).
fistik.sms.etkin=${SMS_ETKIN:true}
fistik.sms.saglayici=${SMS_SAGLAYICI:simulasyon}
fistik.sms.kullanici=${SMS_KULLANICI:}
fistik.sms.sifre=${SMS_SIFRE:}
fistik.sms.baslik=${SMS_BASLIK:}
