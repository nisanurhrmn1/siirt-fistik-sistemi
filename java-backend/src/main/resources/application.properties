# Siirt Fıstığı — Spring Boot ayarları
# Veritabanı bağlantısı proje kökündeki .env dosyasındaki DATABASE_URL'den okunur (OrtamYukleyici).
server.port=${PORT:8000}
spring.application.name=siirt-fistik

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC

# Şema Flyway göçleriyle kurulur (V1 tablolar, V2 trigger/view). Python sürümünün kurduğu mevcut
# veritabanı bulunursa "zaten kurulu" (sürüm 2) kabul edilir.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Başlangıç verisi (kullanıcı, kalite sınıfları, kesinti türleri, silolar) — tablo boşsa eklenir
fistik.seed-demo-data=${SEED_DEMO_DATA:true}

springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.default-produces-media-type=application/json

spring.mvc.problemdetails.enabled=false
spring.web.resources.cache.cachecontrol.max-age=1h
